services:
  api:
    build: .
    image: meteo-api:1.0
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:motdepasse@db:5432/meteo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: motdepasse
      POSTGRES_DB: meteo
    volumes:
      - donnees-pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meteo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  donnees-pg:
