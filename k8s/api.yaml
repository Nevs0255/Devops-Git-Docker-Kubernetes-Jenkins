apiVersion: apps/v1
kind: Deployment
metadata:
  name: meteo-api
  labels:
    app: meteo-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: meteo-api
  template:
    metadata:
      labels:
        app: meteo-api
    spec:
      containers:
        - name: api
          image: meteo-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meteo-secret
                  key: database_url
          readinessProbe:
            httpGet:
              path: /sante
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /sante
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: meteo-api
spec:
  type: NodePort
  selector:
    app: meteo-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
